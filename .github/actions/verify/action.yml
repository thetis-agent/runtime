# ADR 0035: both repositories use the runtime's installed-layout gate.
name: Prepare Thetis delivery
description: Verify in CI or assemble a release from the selected runtime/packages checkout pair
inputs:
  mode:
    description: verify runs CI acceptance and coverage; assemble only builds delivery files (ADR 0055)
    default: verify
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.18.0
        package-manager-cache: false
    - name: Prepare the mandatory Linux boundary
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: bash "$ACTION_ROOT/../../scripts/prepare-runner.sh"
    - name: Install the locked development toolchain without lifecycle scripts
      shell: bash
      working-directory: runtime
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Prepare delivery files
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        DELIVERY_MODE: ${{ inputs.mode }}
      run: bash "$ACTION_ROOT/../../scripts/verify.sh" "$DELIVERY_MODE"
