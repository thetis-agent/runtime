# ADR 0012, ADR 0018: delivery is separate from the kernel's production act.
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag on this repository's main history
        required: true
        type: string
      peer_commit:
        description: Full reviewed packages commit (40 lowercase hexadecimal characters)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    name: Assemble release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PEER_COMMIT: ${{ inputs.peer_commit }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$PEER_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - name: Check out reviewed runtime history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          path: runtime
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Resolve the existing tag once
        id: revision
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        working-directory: runtime
        run: |
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]]
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          git checkout --detach "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Check out the exact reviewed packages commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thetis-agent/packages
          ref: ${{ inputs.peer_commit }}
          token: ${{ secrets.THETIS_SOURCE_TOKEN || github.token }}
          fetch-depth: 0
          path: packages
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Require the peer commit on reviewed main history
        env:
          PEER_COMMIT: ${{ inputs.peer_commit }}
        working-directory: packages
        run: |
          [[ "$(git rev-parse HEAD)" == "$PEER_COMMIT" ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Load runtime release tooling from main
        env:
          TOOLING_COMMIT: ${{ github.sha }}
        run: |
          tooling="$TOOLING_COMMIT"
          git -C runtime merge-base --is-ancestor "$tooling" refs/remotes/origin/main
          mkdir release-tools
          git -C runtime archive "$tooling" .github | tar -x -C release-tools --strip-components=1
          printf 'THETIS_TOOLING_COMMIT=%s\n' "$tooling" >> "$GITHUB_ENV"
          printf 'Release tooling runtime: %s\n' "$tooling" >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble selected sources
        uses: ./release-tools/actions/verify
        with:
          mode: assemble
      - name: Retain diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Hand assembled bytes to publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery/
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish reviewed delivery
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
      url: ${{ steps.publish.outputs.url }}
    permissions:
      contents: write
    steps:
      # No checkout or candidate execution in the job holding a write token.
      - name: Load release signing key
        id: signing_key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          release_key="$RUNNER_TEMP/zero-release-key"
          trap 'rm -f "$release_key"' ERR
          python3 - <<'PYKEY'
          import base64, binascii, os, re, textwrap
          from pathlib import Path

          def normalize(value):
              return value.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\r", "").strip()

          try:
              secret = os.environ.get("RELEASE_SIGNING_KEY", "")
              if not secret or len(secret) > 65536:
                  raise ValueError("missing or oversized key")
              secret = normalize(secret)
              if not secret.startswith("-----BEGIN OPENSSH PRIVATE KEY-----"):
                  secret = normalize(base64.b64decode("".join(secret.split()), validate=True).decode("ascii"))
              match = re.fullmatch(r"-----BEGIN OPENSSH PRIVATE KEY-----\s*(.*?)\s*-----END OPENSSH PRIVATE KEY-----", secret, re.S)
              if not match:
                  raise ValueError("missing OpenSSH envelope")
              body = "".join(match.group(1).split())
              decoded = base64.b64decode(body, validate=True)
              if not decoded.startswith(b"openssh-key-v1\x00"):
                  raise ValueError("invalid OpenSSH payload")
              canonical = "-----BEGIN OPENSSH PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 70)) + "\n-----END OPENSSH PRIVATE KEY-----\n"
              path = Path(os.environ["RUNNER_TEMP"]) / "zero-release-key"
              with path.open("x", encoding="ascii") as output:
                  output.write(canonical)
          except (ValueError, binascii.Error, UnicodeError, OSError):
              raise SystemExit("::error::RELEASE_SIGNING_KEY must be the complete unencrypted OpenSSH private key or base64 of that file; copy it without Markdown fences.")
          PYKEY
          unset RELEASE_SIGNING_KEY
          if ! public_key=$(ssh-keygen -y -P '' -f "$release_key" 2>/dev/null); then
            rm -f "$release_key"
            printf '::error::RELEASE_SIGNING_KEY is damaged or passphrase-protected; replace it with the complete unencrypted key file or its base64 encoding.\n' >&2
            exit 1
          fi
          read -r key_type key_data _ <<< "$public_key"
          printf 'public_key=%s %s\n' "$key_type" "$key_data" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery
      - name: Sign and publish without replacing a release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLIC_KEY: ${{ steps.signing_key.outputs.public_key }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          PEER_COMMIT: ${{ inputs.peer_commit }}
        shell: bash
        run: |
          set -euo pipefail
          cd delivery
          sha256sum --check --strict SHA256SUMS
          jq -e --arg release "$RELEASE_COMMIT" --arg peer "$PEER_COMMIT" \
            '.runtime.commit == $release and .packages.commit == $peer' provenance.json
          # Dereference annotated tags through the API; refuse a tag moved since build.
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          [[ "$(jq -r '.object.type' <<< "$ref")" == tag ]]
          for ((depth=0; depth<4; depth++)); do
            [[ "$(jq -r '.object.type' <<< "$ref")" == tag ]] || break
            object=$(jq -er '.object.sha' <<< "$ref")
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object")
          done
          [[ "$(jq -r '.object.type' <<< "$ref")" == commit ]]
          [[ "$(jq -r '.object.sha' <<< "$ref")" == "$RELEASE_COMMIT" ]]
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '::error::Release already exists; publish a new version.\n'
            exit 1
          fi
          jq -r '"Runtime: " + .runtime.commit, "Packages: " + .packages.commit, "Node: " + .node.version, "Assembly: " + .run' provenance.json > "$RUNNER_TEMP/release-notes.md"
          printf '\nOffline delivery assembled from reviewed main history (ADR 0055). Production activation requires the deployment evaluator and the kernel confirmation transaction (ADR 0014, ADR 0018).\n' >> "$RUNNER_TEMP/release-notes.md"
          # ADR 0052: no candidate execution has access to the release signing key.
          umask 077
          release_key="$RUNNER_TEMP/zero-release-key"
          trap 'rm -f "$release_key"' EXIT
          allowed="release@thetis-agent namespaces=\"zero-release\" $RELEASE_PUBLIC_KEY"
          printf '%s\n' "$allowed" > allowed_signers
          # These are the only delivery bytes changed after verification: the installer's public trust root, tag and asset URL.
          sed -i "s|^ZERO_ALLOWED_SIGNERS=.*|ZERO_ALLOWED_SIGNERS='$allowed'|; s|^ZERO_TAG=.*|ZERO_TAG='$RELEASE_TAG'|; s|^ZERO_RELEASE_URL=.*|ZERO_RELEASE_URL='https://github.com/$GITHUB_REPOSITORY/releases/download'|" install.sh
          sha256sum thetis-distribution.tar.gz package.json profile.lock.json registry.json registry.bundle provenance.json platform.txt kernel-pins.json install.sh > SHA256SUMS
          ssh-keygen -Y sign -n zero-release -f "$release_key" SHA256SUMS
          rm -f "$release_key"
          ssh-keygen -Y verify -f allowed_signers -I release@thetis-agent -n zero-release -s SHA256SUMS.sig < SHA256SUMS
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            thetis-distribution.tar.gz package.json profile.lock.json registry.json \
            registry.bundle provenance.json platform.txt kernel-pins.json \
            SHA256SUMS SHA256SUMS.sig allowed_signers install.sh
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          url=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf 'Published [%s](%s).\n' "$RELEASE_TAG" "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/zero-release-key"
