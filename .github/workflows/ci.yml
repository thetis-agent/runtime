# ADR 0035: verify each change with the peer checkout in the installed layout.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      peer_ref:
        description: Optional packages commit to test a coordinated change
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    name: Resolve source commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.commits.outputs.runtime }}
      packages: ${{ steps.commits.outputs.packages }}
    steps:
      - name: Check out runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thetis-agent/runtime
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: runtime
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Select peer revision
        id: peer
        env:
          INPUT_PEER_REF: ${{ inputs.peer_ref }}
          DEFAULT_PEER_REF: ${{ vars.THETIS_PACKAGES_REF || 'main' }}
        run: |
          ref=$(jq -er --arg input "$INPUT_PEER_REF" --arg fallback "$DEFAULT_PEER_REF" '
            if $input != "" then $input
            elif .pull_request then
              [.pull_request.body // "" | split("\n")[] | rtrimstr("\r") | select(startswith("Thetis peer commit:"))] as $pins
              | if ($pins | length) == 0 then $fallback
                elif ($pins | length) == 1 and ($pins[0] | test("^Thetis peer commit: [0-9a-f]{40}$"))
                then $pins[0] | ltrimstr("Thetis peer commit: ")
                else error("Use one full Thetis peer commit in the pull request body.") end
            else $fallback end
            | if test("^[^\r\n]+$") then . else error("The peer reference must be one line.") end
          ' "$GITHUB_EVENT_PATH")
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - name: Check out packages
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thetis-agent/packages
          ref: ${{ steps.peer.outputs.ref }}
          token: ${{ secrets.THETIS_SOURCE_TOKEN || github.token }}
          fetch-depth: 1
          path: packages
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Pin the source pair for every job
        id: commits
        run: |
          printf 'runtime=%s\n' "$(git -C runtime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'packages=%s\n' "$(git -C packages rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  gates:
    name: Build, static checks and installed service
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thetis-agent/runtime
          ref: ${{ needs.resolve.outputs.runtime }}
          fetch-depth: 0
          path: runtime
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out packages
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thetis-agent/packages
          ref: ${{ needs.resolve.outputs.packages }}
          token: ${{ secrets.THETIS_SOURCE_TOKEN || github.token }}
          fetch-depth: 1
          path: packages
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: ./runtime/.github/actions/verify
        with:
          mode: gates
      - name: Retain static and installation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-gate-reports-${{ github.run_id }}
          path: reports/
          overwrite: true
          if-no-files-found: warn
          retention-days: 14
      - name: Stage delivery pending all test shards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-staged-delivery-${{ github.run_id }}
          path: delivery/
          overwrite: true
          if-no-files-found: error
          retention-days: 14
  test:
    name: Tests (${{ matrix.shard }}/4)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thetis-agent/runtime
          ref: ${{ needs.resolve.outputs.runtime }}
          fetch-depth: 0
          path: runtime
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out packages
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thetis-agent/packages
          ref: ${{ needs.resolve.outputs.packages }}
          token: ${{ secrets.THETIS_SOURCE_TOKEN || github.token }}
          fetch-depth: 1
          path: packages
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: ./runtime/.github/actions/verify
        with:
          mode: shard
          shard: ${{ matrix.shard }}/4
      - name: Retain shard coverage and diagnostics, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-ci-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: reports/
          overwrite: true
          if-no-files-found: warn
          retention-days: 14
  verify:
    name: Full CI
    needs: [resolve, gates, test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pinned reporting tools
        if: ${{ needs.resolve.result == 'success' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thetis-agent/runtime
          ref: ${{ needs.resolve.outputs.runtime }}
          path: runtime
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Download all shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-ci-shard-*-${{ github.run_id }}
          path: shard-reports
      - name: Combine coverage from all four shards
        run: |
          for shard in 1 2 3 4; do
            mv "shard-reports/runtime-ci-shard-$shard-$GITHUB_RUN_ID" "shard-reports/$shard"
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lcov
          bash runtime/.github/scripts/merge-coverage.sh shard-reports reports/coverage
          cat reports/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain combined coverage, including failed tests
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Require every verification job
        if: ${{ always() }}
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          [[ "$RESOLVE_RESULT" == success && "$GATES_RESULT" == success && "$TEST_RESULT" == success ]]
      - name: Download staged delivery
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-staged-delivery-${{ github.run_id }}
          path: delivery
      - name: Verify and finalize the candidate
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RUNTIME_COMMIT: ${{ needs.resolve.outputs.runtime }}
          PACKAGES_COMMIT: ${{ needs.resolve.outputs.packages }}
        run: bash runtime/.github/scripts/finalize-ci.sh delivery
      - name: Retain verified delivery candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery/
          if-no-files-found: error
          retention-days: 14
