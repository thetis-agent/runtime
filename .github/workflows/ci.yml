# ADR 0035: verify each change with the peer checkout in the installed layout.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      peer_ref:
        description: Optional packages commit to test a coordinated change
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Full CI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # KS-003 archives the pinned previous socket implementation from its tag.
          fetch-depth: 0
          path: runtime
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Select peer revision
        id: peer
        env:
          INPUT_PEER_REF: ${{ inputs.peer_ref }}
          DEFAULT_PEER_REF: ${{ vars.THETIS_PACKAGES_REF || 'main' }}
        run: |
          ref=$(jq -er --arg input "$INPUT_PEER_REF" --arg fallback "$DEFAULT_PEER_REF" '
            if $input != "" then $input
            elif .pull_request then
              [.pull_request.body // "" | split("\n")[] | rtrimstr("\r") | select(startswith("Thetis peer commit:"))] as $pins
              | if ($pins | length) == 0 then $fallback
                elif ($pins | length) == 1 and ($pins[0] | test("^Thetis peer commit: [0-9a-f]{40}$"))
                then $pins[0] | ltrimstr("Thetis peer commit: ")
                else error("Use one full Thetis peer commit in the pull request body.") end
            else $fallback end
            | if test("^[^\r\n]+$") then . else error("The peer reference must be one line.") end
          ' "$GITHUB_EVENT_PATH")
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - name: Check out packages
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thetis-agent/packages
          ref: ${{ steps.peer.outputs.ref }}
          token: ${{ secrets.THETIS_SOURCE_TOKEN || github.token }}
          path: packages
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: ./runtime/.github/actions/verify
      - name: Retain coverage, including failed tests
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain diagnostics, including failed gates
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified delivery candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery/
          if-no-files-found: error
          retention-days: 14
